<meta name="theme-color" content="#0f0c29">
<style>
/* ===== VARIABLES ===== */
:root{
  --bg1:#0f0c29;--bg2:#24243e;--rose:#ffc2d9;--lav:#cdb8ff;--vio:#8b6cf0;--gold:#ffd9a0;
  --text:#f6f1ff;--muted:#b9b2d6;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#2b1b4a);background-attachment:fixed;line-height:1.65;overflow-x:hidden;min-height:100vh}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
section{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:96px 22px;text-align:center}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15}
h1{font-size:clamp(2.6rem,9vw,5.6rem)}
h2{font-size:clamp(1.9rem,5vw,3rem);margin-bottom:12px}
.grad{background:linear-gradient(100deg,var(--rose),var(--lav) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:520px;margin:0 auto 40px;font-size:1.05rem}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(5,0,30,.35),inset 0 1px 0 rgba(255,255,255,.12)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:50;background:linear-gradient(90deg,var(--rose),var(--vio),var(--gold));box-shadow:0 0 12px var(--rose)}

/* Reveal al hacer scroll */
.rv{opacity:0;transform:translateY(28px);filter:blur(8px);transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease)}
.rv.in{opacity:1;transform:none;filter:none}

/* Portada */
.hero .heart{font-size:2.4rem;display:inline-block;animation:beat 2.4s ease-in-out infinite;filter:drop-shadow(0 0 16px var(--rose));margin-bottom:22px}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}36%{transform:scale(1.1)}}
.hero p{max-width:480px;margin:24px auto 0;color:var(--muted);font-size:1.15rem}
.caret::after{content:"";display:inline-block;width:3px;height:.85em;background:var(--rose);margin-left:6px;vertical-align:-.05em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.scroll{position:absolute;bottom:32px;width:26px;height:44px;border:2px solid var(--line);border-radius:14px}
.scroll::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--rose);animation:dot 1.8s var(--ease) infinite}
@keyframes dot{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(16px)}}

/* Tarjetas */
.grid{display:grid;gap:18px;width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{padding:30px 26px;text-align:left}
.card h3{font-size:1.35rem;margin:10px 0 8px}
.card p{color:var(--muted)}
.ico{width:34px;height:34px;stroke:var(--rose);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Línea de tiempo */
.tl{position:relative;width:min(640px,100%);text-align:left;padding-left:44px}
.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--rose),var(--vio),transparent)}
.ev{position:relative;padding:22px 24px;margin-bottom:22px}
.ev .dot{position:absolute;left:-44px;top:20px;width:32px;height:32px;border-radius:50%;background:var(--bg1);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,194,217,.4)}
.ev .dot svg{width:16px;height:16px;stroke:var(--rose);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ev small{color:var(--gold);font-size:.85rem}
.ev h3{font-size:1.25rem;margin:2px 0 4px}
.ev p{color:var(--muted)}

/* Contador */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(640px,100%)}
.count div{padding:22px 6px}
.count b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,7vw,3rem);font-variant-numeric:tabular-nums}
.count span{color:var(--muted);font-size:.9rem}

/* Cartas que giran */
.flip{perspective:1000px;min-height:190px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:center}
.flip .in2{position:relative;width:100%;height:100%;min-height:190px;transition:transform .9s var(--ease);transform-style:preserve-3d}
.flip.on .in2{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);font-size:1.02rem;color:var(--text)}
.face .hint{color:var(--muted);font-size:.8rem;margin-top:8px}
.flip:focus-visible,.btn:focus-visible{outline:2px solid var(--lav);outline-offset:4px;border-radius:24px}


/* Galería polaroid */
.polas{display:grid;gap:34px 26px;width:min(1000px,100%);grid-template-columns:repeat(auto-fit,minmax(240px,1fr));padding:10px}
.pola{position:relative;background:#fdfaf6;padding:14px 14px 40px;border-radius:4px;box-shadow:0 18px 40px rgba(5,0,30,.5);transform:rotate(var(--r));transition:transform .6s var(--ease),box-shadow .6s var(--ease);cursor:pointer;color:#3b3350}
.pola:nth-child(odd){--r:-2.5deg}.pola:nth-child(even){--r:2deg}.pola:nth-child(3n){--r:-1deg}
.pola:hover{transform:rotate(0) translateY(-8px) scale(1.03);box-shadow:0 26px 60px rgba(255,194,217,.3)}
.pola .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(135deg,#efe6ff,#ffe4ee);display:grid;place-items:center}
.pola img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pola .add{font-size:.9rem;color:#8b6cf0;text-align:center;padding:10px}
.pola .add b{display:block;font-size:2.2rem;font-weight:300;line-height:1}
.pola .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.05rem}
.pola input{display:none}

/* Botones */
.btn{position:relative;overflow:hidden;min-height:48px;padding:14px 34px;border:0;border-radius:999px;font:600 1rem var(--sans);color:#1a1236;background:linear-gradient(110deg,var(--rose),var(--lav));cursor:pointer;box-shadow:0 10px 30px rgba(205,184,255,.3);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 44px rgba(255,194,217,.5)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line);box-shadow:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,6,32,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.letter{display:flex;flex-direction:column;width:min(540px,100%);max-height:calc(100dvh - 40px);padding:32px 26px 22px;text-align:left;border-radius:26px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(160deg,rgba(46,34,92,.96),rgba(26,19,56,.97));box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(255,194,217,.12);transform:translateY(24px) scale(.97);transition:transform .7s var(--ease);outline:0}
.modal.open .letter{transform:none}
.letter h3{font-size:clamp(1.5rem,5vw,2rem);margin-bottom:14px;text-align:center}
.lscroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:rgba(255,194,217,.4) transparent}
.lscroll::-webkit-scrollbar{width:6px}.lscroll::-webkit-scrollbar-thumb{background:rgba(255,194,217,.35);border-radius:6px}
#lbody p{margin-bottom:14px;color:#efe8ff;font-family:var(--serif);font-size:1.12rem;line-height:1.8}
#lbody .rest{visibility:hidden}
#lbody .cur{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.15em;background:var(--rose);animation:blink 1s steps(2) infinite}
.letter .sign{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--rose);margin:6px 0 8px;opacity:0;transition:opacity 1.2s}
.letter .sign.show{opacity:1}
.lfoot{display:flex;justify-content:center;padding-top:16px;margin-top:8px;border-top:1px solid var(--line)}
.final-msg{min-height:1.6em;margin-top:26px;color:var(--gold);font-family:var(--serif);font-size:1.3rem}


/* Calendario y ticket */
.plan{width:min(520px,100%);margin-top:34px;padding:28px 22px;text-align:center}
.plan[hidden],#out[hidden]{display:none}
.plan h3{font-size:1.6rem;margin-bottom:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:var(--serif);font-weight:500;font-size:1.2rem;text-transform:capitalize}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:1.4rem;cursor:pointer}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{color:var(--muted);font-size:.8rem;padding:6px 0}
.days button{aspect-ratio:1;min-height:40px;border:0;border-radius:50%;background:transparent;color:var(--text);font:inherit;cursor:pointer;transition:background .3s,transform .3s var(--ease)}
.days button:hover:not(:disabled){background:rgba(255,194,217,.2);transform:scale(1.08)}
.days button:disabled{opacity:.25;cursor:default}
.days button.sel{background:linear-gradient(110deg,var(--rose),var(--lav));color:#1a1236;font-weight:700;box-shadow:0 0 20px rgba(255,194,217,.5)}
.days button.today{border:1px solid var(--rose)}
.fields{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin:20px 0 10px;text-align:left}
.fields label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.fields input{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font:1rem var(--sans);color-scheme:dark}
.fields input:focus{outline:2px solid var(--lav)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chips button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:.9rem var(--sans);cursor:pointer}
.chips button:hover{border-color:var(--rose)}
#out{margin-top:24px}
#tk{width:100%;max-width:340px;height:auto;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);margin-bottom:18px}
.note{color:var(--gold);font-size:.9rem;margin-top:12px;min-height:1.3em}
@media (max-width:420px){.fields{grid-template-columns:1fr}}


/* Atmósfera al bajar */
#tint{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background .6s;background:radial-gradient(70% 55% at 50% 105%,hsla(var(--hue,330),85%,72%,.2),transparent 70%),radial-gradient(50% 40% at 100% 0%,hsla(calc(var(--hue,330) + 60),80%,70%,.1),transparent 70%)}
section+section::before{content:"";position:absolute;top:0;left:50%;width:1px;height:64px;background:linear-gradient(transparent,var(--rose))}
.ghost{position:absolute;z-index:-1;pointer-events:none;width:clamp(190px,34vw,390px);aspect-ratio:3/4;opacity:0;transition:opacity 2.2s var(--ease);transform:translateY(var(--py,0px)) rotate(var(--rot,0deg))}
.ghost.in{opacity:var(--o,.14)}
.ghost img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(1.5px) saturate(1.1);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 72%)}
@media (min-width:700px){.pola:nth-child(3n+2){margin-top:46px}}
@media (min-width:820px){
  .tl{width:min(920px,100%);padding-left:0}
  .tl::before{left:50%;margin-left:-1px}
  .ev{width:calc(50% - 34px)}
  .ev:nth-child(odd){margin-right:auto;text-align:right}
  .ev:nth-child(odd) .dot{left:auto;right:-50px}
  .ev:nth-child(even){margin-left:auto}
  .ev:nth-child(even) .dot{left:-50px}
  .ev:nth-child(odd).rv{transform:translateX(-46px)}
  .ev:nth-child(even).rv{transform:translateX(46px)}
  .ev:nth-child(odd).rv.in,.ev:nth-child(even).rv.in{transform:none}
}

/* Música */
#music{position:fixed;right:16px;bottom:16px;z-index:55;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);color:var(--text);font-size:1.2rem;cursor:pointer;transition:transform .4s var(--ease)}
#music:hover{transform:scale(1.1)}
#music.on{box-shadow:0 0 22px rgba(255,194,217,.55);border-color:var(--rose)}
#music.hint{animation:mpulse 2s ease-in-out infinite}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,217,.5)}50%{box-shadow:0 0 0 12px rgba(255,194,217,0)}}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.85rem;padding:0 20px 60px}

@media (max-width:520px){.count{grid-template-columns:repeat(2,1fr)}section{padding:84px 18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none;filter:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="progress"></div>
<canvas id="bg"></canvas>
<div id="tint"></div>
<div style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden" aria-hidden="true"><div id="yt"></div></div>
<button id="music" aria-label="Activar música ambiente" title="Música ambiente">♪</button>

<main>
  <!-- PORTADA -->
  <section class="hero">
    <span class="heart" aria-hidden="true">🎂</span>
    <h1 class="grad" id="greet"></h1>
    <p id="heroSub"></p>
    <div class="scroll" aria-hidden="true"></div>
  </section>

  <!-- LO QUE ME GUSTA -->
  <section>
    <h2 class="rv grad" id="t1"></h2>
    <p class="sub rv" id="s1"></p>
    <div class="grid" id="likes"></div>
  </section>

  <!-- HISTORIA -->
  <section>
    <h2 class="rv grad" id="t2"></h2>
    <p class="sub rv" id="s2"></p>
    <div class="tl" id="timeline"></div>
  </section>

  <!-- CONTADOR -->
  <section>
    <h2 class="rv grad" id="t3"></h2>
    <p class="sub rv" id="s3"></p>
    <div class="count rv">
      <div class="glass"><b id="cd">0</b><span>días</span></div>
      <div class="glass"><b id="ch">0</b><span>horas</span></div>
      <div class="glass"><b id="cm">0</b><span>minutos</span></div>
      <div class="glass"><b id="cs">0</b><span>segundos</span></div>
    </div>
  </section>

  <!-- ADMIRO -->
  <section>
    <h2 class="rv grad" id="t4"></h2>
    <p class="sub rv" id="s4"></p>
    <div class="grid" id="admire"></div>
  </section>

  <!-- GALERÍA -->
  <section>
    <h2 class="rv grad" id="tg"></h2>
    <p class="sub rv" id="sg"></p>
    <div class="polas" id="polas"></div>
  </section>

  <!-- SORPRESA -->
  <section>
    <h2 class="rv grad" id="t5" style="margin-bottom:34px"></h2>
    <div class="rv"><button class="btn" id="openLetter"></button></div>
  </section>

  <!-- CIERRE -->
  <section>
    <h2 class="rv grad" id="t6"></h2>
    <p class="sub rv" id="s6"></p>
    <div class="row rv">
      <button class="btn" id="yes"></button>
      <button class="btn ghost" id="maybe"></button>
    </div>
    <div class="final-msg" id="final" aria-live="polite"></div>
    <div class="plan glass" id="plan" hidden>
      <h3 class="grad">Elijamos cuándo celebrarte</h3>
      <div class="calhead"><button class="nav" id="prev" aria-label="Mes anterior">‹</button><b id="calt"></b><button class="nav" id="next" aria-label="Mes siguiente">›</button></div>
      <div class="dow"><span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sa</span><span>Do</span></div>
      <div class="days" id="days"></div>
      <div class="fields">
        <label>Hora<input type="time" id="time" value="18:00"></label>
        <label>Lugar<input id="place" placeholder="¿Dónde te gustaría?" maxlength="60"></label>
      </div>
      <div class="chips" id="chips"></div>
      <button class="btn" id="gen">Generar mi ticket</button>
      <div class="note" id="note" aria-live="polite"></div>
      <div id="out" hidden>
        <canvas id="tk" width="1080" height="1500"></canvas>
        <div class="row"><button class="btn" id="share">Enviar a Emerson</button><button class="btn ghost" id="dl">Descargar</button></div>
      </div>
    </div>
  </section>
</main>
<footer id="foot"></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="lt">
  <div class="letter" id="letterBox" tabindex="-1">
    <h3 id="lt" class="grad"></h3>
    <div class="lscroll" id="lscroll">
      <div id="lbody"></div>
      <p class="sign" id="lsign"></p>
    </div>
    <div class="lfoot"><button class="btn" id="closeLetter">Cerrar</button></div>
  </div>
</div>

      { icon: "chat",  d: "Una charla especial", h: "Hablamos de todo",      p: "Gracias por compartir cada rato en que el tiempo" },

    title: "Momentos que quiero guardar", sub: "Algunas fotos que me gustan mucho. si dejame a mi me gustan estas fotos y espero que a vos tambien te gusten.; por eso necesitamos salir para que te tome mas fotos y asi tener recuerdos de nosotros.",

  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, "#0f0c29"); g.addColorStop(1, "#4a2a7a");

  for (let i = 0; i < 80; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * .6})`; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, Math.random() * 2.2 + .4, 0, 6.28); x.fill(); }
  x.save(); x.shadowColor = "rgba(0,0,0,.5)"; x.shadowBlur = 60; x.shadowOffsetY = 20; x.fillStyle = "#fdfaf6"; rr(x, 90, 110, 900, 1280, 48); x.fill(); x.restore();
  x.fillStyle = g; [[90, 960], [990, 960]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b, 42, 0, 6.28); x.fill(); });
  x.strokeStyle = "#cdb8ff"; x.lineWidth = 3; x.setLineDash([12, 12]); x.beginPath(); x.moveTo(150, 960); x.lineTo(930, 960); x.stroke(); x.setLineDash([]);
  x.textAlign = "center"; x.fillStyle = "#e88aa8"; x.font = "70px Georgia,serif"; x.fillText("♥", cx, 250);
  x.fillStyle = "#8b6cf0"; x.font = "italic 44px Georgia,serif"; x.fillText("Celebración confirmada", cx, 320);
  x.fillStyle = "#2f2750"; x.font = "bold 78px Georgia,serif"; x.fillText(`${CONFIG.me} & ${CONFIG.her}`, cx, 430);
  x.strokeStyle = "#f1d3df"; x.lineWidth = 2; x.beginPath(); x.moveTo(300, 480); x.lineTo(780, 480); x.stroke();
  const rows = [["Fecha", fmtDate()], ["Hora", fmtTime()], ["Lugar", $("place").value.trim()]]; let y = 570;
  rows.forEach(([l, v]) => { x.fillStyle = "#9a8fb8"; x.font = "34px system-ui,sans-serif"; x.fillText(l, cx, y);
    x.fillStyle = "#2f2750"; x.font = (l === "Lugar" ? "bold 52px" : "bold 56px") + " Georgia,serif"; x.font = x.font.replace(/^bold \d+px/, "bold " + (v.length > 28 ? 44 : 56) + "px");
    const extra = wrap(x, v, cx, y + 70, 740, 60); y += 150 + extra; });
  x.fillStyle = "#2f2750"; x.font = "italic 46px Georgia,serif"; x.fillText("Entrada de cumpleaños", cx, 1070);
  x.fillStyle = "#9a8fb8"; x.font = "30px system-ui,sans-serif"; x.fillText("Válido para celebrar tu día", cx, 1125);
  x.fillStyle = "#2f2750"; for (let i = 0, px = 270; i < 40; i++) { const bw = [3, 6, 4, 8, 2][i * 7 % 5]; x.fillRect(px, 1190, bw, 90); px += bw + 7; }
  x.fillStyle = "#9a8fb8"; x.font = "28px system-ui,sans-serif"; x.fillText(`Nº ${String(picked.getDate()).padStart(2, "0")}${String(picked.getMonth() + 1).padStart(2, "0")}-${CONFIG.her.slice(0, 3).toUpperCase()}${CONFIG.me.slice(0, 3).toUpperCase()}`, cx, 1330);
}
function msg(t){ set("note", t); }
$("gen").onclick = () => {
  if (!picked) return msg("Elegí primero un día en el calendario.");
  if (!$("time").value) return msg("Elegí una hora.");
  if (!$("place").value.trim()) return msg("Escribí o elegí un lugar.");
  msg(""); drawTicket(); $("out").hidden = false; hearts(40, false);
  setTimeout(() => $("out").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }), 150);
};
const blobTk = () => new Promise(r => $("tk").toBlob(r, "image/png"));
async function dlTk(){ const b = await blobTk(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "ticket-cumple.png"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
$("dl").onclick = dlTk;
$("share").onclick = async () => {
  const b = await blobTk(), f = new File([b], "ticket-cumple.png", { type: "image/png" });
  const txt = `Hola ${CONFIG.me}, confirmo mi celebración de cumpleaños: ${fmtDate()}, ${fmtTime()}, en ${$("place").value.trim()} 💗`;
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], text: txt }); return; } catch (e) { if (e.name === "AbortError") return; } }
  dlTk(); msg("Se descargó tu ticket. Adjuntalo en el chat que se va a abrir.");
  setTimeout(() => window.open(`https://wa.me/${CONFIG.close.phone}?text=${encodeURIComponent(txt)}`, "_blank"), 900);
};

/* ============================================================
   MÚSICA: YouTube (si hay link en CONFIG.music.youtube) o sonido ambiente
   ============================================================ */
const ytId = u => { u = (u || "").trim(); const m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : ""); };
const VID = ytId(CONFIG.music.youtube);
let yt, ytReady = false, ytWanted = false, isOn = false, ac, master;
function setBtn(on){ isOn = on; const b = $("music"); b.textContent = on ? "♫" : "♪"; b.classList.toggle("on", on); b.setAttribute("aria-label", on ? "Pausar música" : "Activar música"); }
function loadYT(){
  if (!VID || yt || window.YT && window.YT.Player && yt) return;
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("yt", { width: "1", height: "1", videoId: VID,
      playerVars: { controls: 0, disablekb: 1, playsinline: 1, loop: 1, playlist: VID, start: CONFIG.music.start || 0, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => { ytReady = true; yt.setVolume(CONFIG.music.volume || 70); if (ytWanted) yt.playVideo(); },
        onStateChange: e => { if (e.data === 1) setBtn(true); if (e.data === 2 && !ytWanted) setBtn(false); },
        onError: () => { ytWanted = false; setBtn(false); }
      } });
  };
  const t = document.createElement("script"); t.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(t);
}
function ambient(on){
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    [196, 246.94, 293.66, 392].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
      o.type = "sine"; o.frequency.value = f; g.gain.value = .12; l.frequency.value = .08 + i * .03; lg.gain.value = .05;
      l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(master); o.start(); l.start(); });
  }
  ac.resume(); master.gain.linearRampToValueAtTime(on ? .5 : 0, ac.currentTime + 1.5);
}
function musicPlay(){ setBtn(true); if (VID) { ytWanted = true; loadYT(); if (ytReady) yt.playVideo(); } else ambient(true); }
function musicPause(){ setBtn(false); if (VID) { ytWanted = false; if (ytReady) yt.pauseVideo(); } else ambient(false); }
$("music").onclick = () => { $("music").classList.remove("hint"); isOn ? musicPause() : musicPlay(); };
loadYT();
$("music").classList.add("hint");
/* Inicio automático: los navegadores exigen un primer toque; apenas ella toca la página, empieza */
let autoStart = true;
["pointerdown", "keydown", "touchend"].forEach(ev => addEventListener(ev, e => {
  if (!autoStart) return; autoStart = false;
  if (e.target.closest && e.target.closest("#music")) return;
  $("music").classList.remove("hint"); if (!isOn) musicPlay();
}, { passive: true }));
</script>
